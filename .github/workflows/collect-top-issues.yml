name: Collect top-repo issues

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python src/collect_top.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # always(): a run that skipped an unreachable repo (or stopped on a rate
      # limit) exits non-zero to flag it, but the snapshot it did produce is
      # still good and should not be thrown away.
      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A on output/ as a whole, not the top-*/ glob: a collection dropped
          # from languages.json is deleted outright, and the glob would no
          # longer match it, leaving the deletion unstaged forever.
          git add -A README.md output
          git diff --cached --quiet || git commit -m "chore: weekly top-repo issue snapshot"
          git push
