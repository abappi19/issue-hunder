name: Discover top repos

on:
  schedule:
    # Odd days of the month at 02:00 UTC. */2 counts days of the month, not a
    # rolling 48 hours, so a 31-day month is followed by two runs in a row.
    # Runs first: it writes the data/top_*.json that collect-top-issues reads.
    - cron: "0 2 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python src/discover_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "chore: refresh top-repos list"
          git push
