name: Collect open issues

on:
  schedule:
    # Odd days of the month at 03:00 UTC, an hour after discovery. The hour
    # gap keeps the three from pushing to the same branch at once.
    - cron: "0 3 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python src/main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # always(): a run that skipped an unreachable repo (or stopped on a rate
      # limit) exits non-zero to flag it, but the snapshot it did produce is
      # still good and should not be thrown away.
      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A so pruned pages are staged as deletions: a plain `git add <dir>`
          # misses a directory that no longer exists at all.
          git add -A README.md output/projects
          git diff --cached --quiet || git commit -m "chore: issue snapshot"
          git push
